<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无权限 · 辰光 Agent</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="denied" data-title="无权限" data-group="系统管理">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content" data-gate-scope>
      <div class="denied">
        <div class="denied-code">403</div>
        <h1>你没有访问这个页面的权限</h1>
        <p>当前身份 <b data-role-name>只读审计</b> 未被授予 <span class="code">settings:update</span>。系统配置涉及密钥与全局参数，只对管理员开放。</p>
        <p class="cell-sub" data-denied-super hidden style="margin-top:6px">当前身份是超级管理员，实际不会遇到此页面；这里仅作为权限不足状态的视觉示例。</p>

        <div class="denied-need">
          <span class="i-15" data-icon="lock"></span>
          <span>所需权限：<span class="code">settings:update</span></span>
          <span class="tally-sep"></span>
          <span>可联系管理员在「角色管理」中为你的角色添加</span>
        </div>

        <div class="denied-actions">
          <button class="btn btn-primary" data-denied-switch onclick="setRole('admin')">以超级管理员查看</button>
          <a class="btn btn-outline" href="dashboard.html">返回工作台</a>
          <button class="btn btn-ghost" data-toast="你当前拥有的权限码可在「权限矩阵」页核对（原型示意）">查看我的权限</button>
        </div>

        <p class="cell-sub" style="margin-top:26px;max-width:52ch">本页为无权限状态的示例。真实实现中，前端在进入路由前拦截，后端同时返回 <span class="code">403</span>，两层判断缺一不可。</p>
      </div>
    </main>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
